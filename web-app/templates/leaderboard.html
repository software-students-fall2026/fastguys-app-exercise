{% extends 'base.html' %} 

{% block container %}

<div class="window">
	<div class = "home-frame">
		<div class = "home-screen">  
            <table>
                <tr>
                    <th>Game ID</th>
                    <th>Animal</th>
                    <th>Blinks</th>
                </tr>

                {% for game in game_ids %}
                    <tr>
                        <td>{{ game.game_id }}</td>
                        <td>{{ game.animal }}</td>
                        <td>{{ game.blink_count }}</td>
                    </tr>
                {% endfor %}
            </table>

            <form action="/" method="GET">
                <button type="submit">Home</button>
            </form>
        </div>
	</div>
</div>

{% endblock %}
