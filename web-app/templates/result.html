{% extends 'base.html' %} 

{% block container %}

<div class="window">
	<div class = "home-frame">
		<div class = "home-screen">  
            <h1 class="title-header">You are a {{animal}}!</h1>
            <h2>Your blink count was {{blink_count}}.</h2>

            <form action="/api/game/start" method="GET">
                <button type="submit">Play Again</button>
            </form>

            <form action="/api/leaderboard" method="GET">
                <button type="submit">Leaderboard</button>
            </form>
            
        </div>
	</div>
</div>

{% endblock %}
